name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - name: Verify deterministic Fatherhand grant chain
        run: |
          npm run --silent fatherhand-001 > /tmp/fatherhand-1.json
          npm run --silent fatherhand-001 > /tmp/fatherhand-2.json
          cmp /tmp/fatherhand-1.json /tmp/fatherhand-2.json
